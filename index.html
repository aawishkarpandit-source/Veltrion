<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <title>VELTRION — Software &amp; Digital Technology</title>
    <meta
      name="description"
      content="VELTRION builds websites, software, business systems, design, marketing and support for businesses, organizations and individuals. Engineered for What's Next."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VELTRION" />
    <meta property="og:title" content="VELTRION — Engineered for What's Next." />
    <meta
      property="og:description"
      content="Websites, software, business systems, design, marketing and support."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VELTRION — Engineered for What's Next." />
    <meta
      name="twitter:description"
      content="Websites, software, business systems, design, marketing and support."
    />
    <meta name="twitter:image" content="/og.png" />
    <script>
      // Mark JS as available (reveals only animate when this class is present)
      // and resolve the theme before first paint: stored choice > OS setting.
      (function () {
        try {
          document.documentElement.classList.add('js');
          var stored = localStorage.getItem('veltrion-theme');
          var t =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
